<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#c4a7ff"/>
      <stop offset="50%" stop-color="#9b6dff"/>
      <stop offset="100%" stop-color="#5d3f9c"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ee9ff"/>
      <stop offset="100%" stop-color="#3aa8d6"/>
    </linearGradient>
    <radialGradient id="bg" cx="35%" cy="35%" r="75%">
      <stop offset="0%"  stop-color="#1a1a3d"/>
      <stop offset="100%" stop-color="#0a0a25"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Outer accent ring -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none"
        stroke="url(#purple)" stroke-width="1.4" opacity="0.55"/>
  <!-- Stylized "A" shape: triangle outline + crossbar -->
  <path d="M14 50 L32 11 L50 50 Z" fill="none" stroke="url(#purple)" stroke-width="3.4" stroke-linejoin="round"/>
  <path d="M22 36 L42 36" stroke="url(#cyan)" stroke-width="3" stroke-linecap="round"/>
  <!-- Sparkle accent -->
  <circle cx="32" cy="20" r="1.6" fill="#7ee9ff" opacity="0.9"/>
  <circle cx="22" cy="46" r="1.2" fill="#c4a7ff" opacity="0.7"/>
  <circle cx="42" cy="46" r="1.2" fill="#c4a7ff" opacity="0.7"/>
</svg>
